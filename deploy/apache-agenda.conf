# Fragmento para el VirtualHost existente.
# Necesita: a2enmod proxy proxy_http rewrite

# API: /agenda-api/... -> uvicorn en :8001 (sin el prefijo)
ProxyPreserveHost On
ProxyPass        /agenda-api/ http://127.0.0.1:8001/
ProxyPassReverse /agenda-api/ http://127.0.0.1:8001/

# Frontend Angular compilado con: ng build --base-href /agenda/
Alias /agenda /opt/agenda/www

<Directory /opt/agenda/www>
    Require all granted
    Options -Indexes

    # Rutas del router de Angular: lo que no sea un archivo real cae en index.html
    RewriteEngine On
    RewriteBase /agenda/
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule . /agenda/index.html [L]
</Directory>
